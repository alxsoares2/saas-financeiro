name: Alertas de Vencimentos

on:
  schedule:
    # Diariamente às 8h UTC (5h Brasília) — um pouco depois dos recorrentes (6h UTC)
    - cron: "0 8 * * *"
  workflow_dispatch:  # Permite rodar manual via GitHub UI

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de alertas de vencimentos
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://saas-financeiro-production-63fd.up.railway.app/api/cron/alertas-vencimentos

      - name: Log de sucesso
        if: success()
        run: echo "✅ Alertas de vencimento verificados e enviados"

      - name: Log de erro
        if: failure()
        run: echo "❌ Erro ao verificar alertas de vencimento"
